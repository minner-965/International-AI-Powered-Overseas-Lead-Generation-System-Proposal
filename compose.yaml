name: dpv-leadgen

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

  n8n:
    image: n8nio/n8n:2.36.7
    restart: unless-stopped
    env_file:
      - .env.phase2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/files/workflows

  phase7-runtime-init:
    image: dpv-leadgen-demo-dashboard
    user: "0:0"
    restart: "no"
    command: ["sh", "-lc", "mkdir -p /app/runtime/phase7/staging /app/runtime/phase7/exports && chown -R 1000:1000 /app/runtime/phase7"]
    volumes:
      - phase7_runtime:/app/runtime/phase7

  demo-dashboard:
    build:
      context: .
      dockerfile: services/demo-dashboard/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.phase2
      - path: .env.phase7-api
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      phase7-runtime-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      PGBOSS_PROCESS_JOBS: "false"
      DATA_EXCHANGE_STAGING_DIR: /app/runtime/phase7/staging
      DATA_EXCHANGE_EXPORT_DIR: /app/runtime/phase7/exports
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./services/demo-dashboard/src/server.js:/app/src/server.js:ro
      - ./services/demo-dashboard/src/jobs/phase5Queue.js:/app/src/jobs/phase5Queue.js:ro
      - ./services/demo-dashboard/public/phase5.css:/app/public/phase5.css:ro
      - phase7_runtime:/app/runtime/phase7
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  category-worker:
    image: dpv-leadgen-demo-dashboard
    restart: unless-stopped
    env_file:
      - .env.phase2
    depends_on:
      postgres:
        condition: service_healthy
      phase7-runtime-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      HTTP_LISTEN_ENABLED: "false"
      PGBOSS_PROCESS_JOBS: "true"
      PGBOSS_QUEUE_ALLOWLIST: "enrich-decision-makers,collect-category-buyer-evidence,classify-buyer-business-model,calculate-category-procurement-match,calculate-product-opportunities,recalculate-cooperation-v3,recalculate-business-opportunities,refresh-opportunity-exception-queue"
      DATA_EXCHANGE_STAGING_DIR: /app/runtime/phase7/staging
      DATA_EXCHANGE_EXPORT_DIR: /app/runtime/phase7/exports
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./services/demo-dashboard/src/server.js:/app/src/server.js:ro
      - ./services/demo-dashboard/src/jobs/phase5Queue.js:/app/src/jobs/phase5Queue.js:ro
      - phase7_runtime:/app/runtime/phase7

  outreach-worker:
    image: dpv-leadgen-demo-dashboard
    restart: unless-stopped
    env_file:
      - path: .env.phase7-outreach
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      phase7-runtime-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      HTTP_LISTEN_ENABLED: "false"
      PGBOSS_ENABLED: "true"
      PGBOSS_PROCESS_JOBS: "true"
      PGBOSS_QUEUE_ALLOWLIST: "verify-outreach-contact,generate-outreach-draft,validate-outreach-draft,send-outreach-email,process-email-provider-event,process-inbound-message,classify-inbound-reply,create-sales-followup,sync-outreach-to-crm"
      DATA_EXCHANGE_STAGING_DIR: /app/runtime/phase7/staging
      DATA_EXCHANGE_EXPORT_DIR: /app/runtime/phase7/exports
      CRM_BASE_URL: ${CRM_BASE_URL:-}
      CRM_API_KEY: ${CRM_API_KEY:-}
      CRM_TIMEOUT_MS: ${CRM_TIMEOUT_MS:-10000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./services/demo-dashboard/src/server.js:/app/src/server.js:ro
      - ./services/demo-dashboard/src/jobs/phase5Queue.js:/app/src/jobs/phase5Queue.js:ro
      - phase7_runtime:/app/runtime/phase7

  data-worker:
    image: dpv-leadgen-demo-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      phase7-runtime-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      HTTP_LISTEN_ENABLED: "false"
      PGBOSS_PROCESS_JOBS: "true"
      PGBOSS_QUEUE_ALLOWLIST: "discover-shared-import-files,parse-reference-import,commit-reference-import,export-business-data,recalculate-after-import"
      DATA_EXCHANGE_STAGING_DIR: /app/runtime/phase7/staging
      DATA_EXCHANGE_EXPORT_DIR: /app/runtime/phase7/exports
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./services/demo-dashboard/src/server.js:/app/src/server.js:ro
      - ./services/demo-dashboard/src/jobs/phase5Queue.js:/app/src/jobs/phase5Queue.js:ro
      - phase7_runtime:/app/runtime/phase7

volumes:
  n8n_data:
  postgres_data:
  phase7_runtime:
