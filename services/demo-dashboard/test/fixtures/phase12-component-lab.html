<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3 isolated component checks</title>
<link rel="stylesheet" href="../../public/ui/v3/tokens.css"><link rel="stylesheet" href="../../public/ui/v3/foundation.css"><link rel="stylesheet" href="../../public/ui/v3/components.css"></head>
<body><main class="container-xl crm-content">
<h1>组件检查 / Component checks</h1><p>This isolated fixture is outside the production static root. No business data or requests.</p>
<section class="dpv-panel"><div class="dpv-panel__body"><div class="dpv-actions"><button id="open" class="dpv-button dpv-button--primary">打开窗口 / Open dialog</button><button class="dpv-button" disabled aria-describedby="reason">保存 / Save</button></div><p id="reason">请先填写内容 / Enter content first</p><label for="long">备注 / Notes</label><textarea class="dpv-field" id="long">Long label wrapping and keyboard navigation fixture.</textarea></div></section>
<section id="states" aria-label="Component states"></section>
<div class="dpv-table-wrap" tabindex="0" role="region" aria-label="Table"><table class="dpv-table"><thead><tr><th>项目 / Item</th><th>状态 / State</th></tr></thead><tbody><tr><td>本地组件检查 / Local component check</td><td><span class="dpv-badge dpv-badge--info">信息 / Information</span></td></tr></tbody></table></div>
<dialog class="dpv-dialog" id="dialog" aria-labelledby="title"><header class="dpv-panel__head"><h2 id="title">查看内容 / View content</h2><button class="dpv-button" data-dpv-dialog-close aria-label="关闭 / Close">×</button></header><div class="dpv-dialog__body"><label for="entry">备注 / Notes</label><input class="dpv-field" id="entry"></div><footer class="dpv-dialog__foot"><button class="dpv-button" data-dpv-dialog-close>返回 / Back</button></footer></dialog>
</main><script type="module">import { componentStates, stateMarkup, bindDialog } from '../../public/ui/v3/components.js'; const labels = [['更新中','Updating'],['暂无记录','No records'],['已完成','Completed'],['待确认','Awaiting confirmation'],['请稍后重试','Please try again'],['请先填写内容','Enter content first'],['资料待更新','Update needed'],['需要访问权限','Access required'],['部分服务待恢复','Partial service availability']]; document.querySelector('#states').innerHTML = componentStates.map((state,i)=>stateMarkup(state,...labels[i])).join(''); const adapter=bindDialog(document.querySelector('#dialog')); document.querySelector('#open').addEventListener('click',event=>adapter.open(event.currentTarget));</script></body></html>
