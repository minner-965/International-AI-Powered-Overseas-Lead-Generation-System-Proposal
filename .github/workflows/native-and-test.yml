name: Native dependency and test verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/demo-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/demo-dashboard/package-lock.json
      - name: Clean dependency installation
        run: npm ci
      - name: GoRules native smoke test
        run: npm run test:native-smoke
      - name: Full test suite
        run: npm test
